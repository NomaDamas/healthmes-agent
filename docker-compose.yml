# HealthMes Agent stack — three planes on one bridge network (docs/PLAN.md §1).
#
#   data plane   : postgres (+ dedicated healthmes DB), redis,
#                  open-wearables backend + celery worker/beat + its MCP server
#   healthmes    : glue service (FastAPI + fastmcp) built from Dockerfile.healthmes
#   reasoning    : one attested Hermes Responses runtime behind HealthMes
#
# Service definitions for the vendored upstreams are grounded in
# vendor/open-wearables/docker-compose.yml and vendor/hermes-agent/docker-compose.yml
# (images, build contexts, commands, and env names reused verbatim where possible).
# vendor/ is never modified: open-wearables config lives in ./config/open-wearables.env
# (compose-injected env vars take precedence over the image's config/.env lookup),
# and the dedicated Hermes home is ./data/hermes/decision.
#
# Quick start:
#   cp .env.example .env                                  # fill in tokens/keys
#   cp config/open-wearables.env.example config/open-wearables.env
#   docker compose up -d                                  # core stack
#   uv run python scripts/bootstrap.py --mode docker      # optional decision
#   docker compose --profile decision up -d

name: healthmes-agent

services:
  postgres:
    # Task-pinned postgres:16 (vendor compose runs postgres:18; the init-script
    # contract and env names are identical). PG16 keeps PGDATA at
    # /var/lib/postgresql/data.
    image: postgres:16
    environment:
      # Verbatim from vendor/open-wearables/docker-compose.yml so the
      # open-wearables backend defaults keep working.
      POSTGRES_DB: open-wearables
      POSTGRES_USER: open-wearables
      POSTGRES_PASSWORD: open-wearables
      # Consumed by scripts/initdb/01-create-healthmes-db.sh on first boot to
      # create the second database next to the open-wearables one.
      HEALTHMES_DB_NAME: healthmes
      HEALTHMES_DB_USER: healthmes
      HEALTHMES_DB_PASSWORD: healthmes
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open-wearables -d open-wearables"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:8
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  ow-backend:
    # Mirrors the `app` service of vendor/open-wearables/docker-compose.yml.
    build:
      context: ./vendor/open-wearables/backend
      dockerfile: Dockerfile
    image: open-wearables-platform:latest
    pull_policy: never
    command: scripts/start/app.sh
    env_file:
      # Root-owned copy of vendor/open-wearables/backend/config/.env.example —
      # vendor/ stays untouched. Optional so `docker compose config` validates
      # before the file exists; create it before `up`.
      - path: ./config/open-wearables.env
        required: false
    environment:
      # Env names verbatim from the vendor compose; values point at this
      # stack's service names.
      - DB_HOST=postgres
      - REDIS_HOST=redis
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure

  ow-worker:
    # Mirrors the `celery-worker` service of the vendor compose.
    image: open-wearables-platform:latest
    pull_policy: never
    command: scripts/start/worker.sh
    env_file:
      - path: ./config/open-wearables.env
        required: false
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - redis
      - postgres
      - ow-backend
    restart: on-failure

  ow-beat:
    # Mirrors the `celery-beat` service of the vendor compose. The worker
    # executes sync tasks; Beat is the separate process that enqueues them.
    image: open-wearables-platform:latest
    pull_policy: never
    command: scripts/start/beat.sh
    env_file:
      - path: ./config/open-wearables.env
        required: false
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - redis
      - postgres
      - ow-backend
    restart: on-failure

  healthmes:
    build:
      context: .
      dockerfile: Dockerfile.healthmes
    image: healthmes:latest
    pull_policy: never
    env_file:
      # Optional root .env for secrets. In-cluster endpoints below take
      # precedence over any host-oriented values in .env.
      - path: ./.env
        required: false
    # The image CMD is just `python -m healthmes`; migrations run here so the
    # container owns its schema (scripts/dev_mac.sh does the same natively).
    command: ["sh", "-c", "alembic upgrade head && exec python -m healthmes"]
    environment:
      - HEALTHMES_DATABASE_URL=postgresql+psycopg://healthmes:healthmes@postgres:5432/healthmes
      - HEALTHMES_OW_BASE_URL=http://ow-backend:8000
      - HEALTHMES_NATIVE_ALERT_DELIVERY=true
      - HEALTHMES_DECISION_HERMES_BASE_URL=${HEALTHMES_DECISION_HERMES_BASE_URL:-}
      - HEALTHMES_DECISION_HERMES_MODEL=${HEALTHMES_DECISION_HERMES_MODEL:-}
      - HEALTHMES_DECISION_HERMES_PROVIDER=${HEALTHMES_DECISION_HERMES_PROVIDER:-}
      - HEALTHMES_DECISION_HERMES_API_KEY=${HEALTHMES_DECISION_HERMES_API_KEY:-}
      - HEALTHMES_DECISION_CORRELATION_SECRET=${HEALTHMES_DECISION_CORRELATION_SECRET:-}
      - HEALTHMES_DECISION_HERMES_PROFILE_PATH=/run/healthmes-decision/config.yaml
      - HEALTHMES_DECISION_HERMES_RUNTIME_MANIFEST_PATH=/run/healthmes-decision/runtime-manifest.json
      - HEALTHMES_DECISION_HERMES_ATTESTATION_KEY_PATH=/run/healthmes-decision/runtime-attestation.key
      - HEALTHMES_DECISION_HERMES_ALLOW_ATTESTED_PRIVATE_HTTP=true
      - HEALTHMES_DATA_DIR=/data
      - HEALTHMES_PORT=8100
      # Inside the container the service must bind all interfaces for the
      # port mapping to work; the serve entrypoint therefore REQUIRES
      # HEALTHMES_API_TOKEN (set it in .env) — the surface carries medical
      # data and the published port is reachable from the LAN.
      - HEALTHMES_HOST=0.0.0.0
      - HEALTHMES_API_TOKEN=${HEALTHMES_API_TOKEN:-}
      - HEALTHMES_CALENDAR_ADJUSTMENT_SECRET=${HEALTHMES_CALENDAR_ADJUSTMENT_SECRET:-}
      - HEALTHMES_TELEGRAM_OWNER_USER_ID=${HEALTHMES_TELEGRAM_OWNER_USER_ID:-}
      - HEALTHMES_TELEGRAM_OWNER_CHAT_ID=${HEALTHMES_TELEGRAM_OWNER_CHAT_ID:-}
      # Container clocks are UTC; forward the user's IANA timezone from .env /
      # the shell so local-day joins and alert quiet hours stay correct
      # (empty = fall back to UTC).
      - HEALTHMES_TIMEZONE=${HEALTHMES_TIMEZONE:-}
    volumes:
      - healthmes_data:/data
      - ./data/hermes/decision:/run/healthmes-decision:ro
    ports:
      - "${HEALTHMES_PORT:-8100}:8100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: on-failure

  hermes-decision:
    # HealthMes owns this process and its public surface. The supervisor starts
    # one child with the manifest-bound /opt/data HERMES_HOME, scrubs messaging
    # and plugin environment variables, proxies only Responses/session probes,
    # and signs a nonce-bound attestation before every model turn.
    build:
      context: ./vendor/hermes-agent
    image: hermes-agent
    profiles: ["decision"]
    user: "${HERMES_UID:-10000}:${HERMES_GID:-10000}"
    restart: unless-stopped
    # The supported decision timeout is at most 300 seconds. Child shutdown
    # then has at most 10 seconds for TERM and 5 seconds after KILL. Keep
    # Docker's grace period above that 315-second bound so leases drain first.
    stop_grace_period: 6m
    entrypoint:
      - /opt/hermes/.venv/bin/python
      - -m
      - healthmes.hermes_runtime_supervisor
    volumes:
      - ./data/hermes/decision:/opt/data
      - ./healthmes:/opt/healthmes/healthmes:ro
    environment:
      - HERMES_HOME=/opt/data
      - PYTHONPATH=/opt/healthmes
      - HEALTHMES_DECISION_RUNTIME_HOST=0.0.0.0
      - HEALTHMES_DECISION_RUNTIME_PORT=8645
      - HEALTHMES_DECISION_RUNTIME_MAX_CONCURRENT_RESPONSES=${HEALTHMES_DECISION_MAX_PENDING_REQUESTS:-8}
      - HEALTHMES_DECISION_RUNTIME_CHILD_TERM_TIMEOUT_SECONDS=${HEALTHMES_DECISION_RUNTIME_CHILD_TERM_TIMEOUT_SECONDS:-10}
      - HEALTHMES_DECISION_RUNTIME_CHILD_KILL_TIMEOUT_SECONDS=${HEALTHMES_DECISION_RUNTIME_CHILD_KILL_TIMEOUT_SECONDS:-5}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
    expose:
      - "8645"
    depends_on:
      healthmes:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8645/healthmes/runtime-health >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    command:
      [
        "--hermes-home",
        "/opt/data",
        "--vendor-root",
        "/opt/hermes",
      ]

volumes:
  postgres_data:
  redis_data:
  healthmes_data:

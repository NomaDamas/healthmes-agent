# XcodeGen spec for the HealthMes iOS/watchOS companion (issues #7 + #10).
#
# Regenerate the project after editing this file or adding sources:
#   brew install xcodegen        # once
#   cd apps/ios-companion && xcodegen generate
#
# CI and simulator builds use CODE_SIGNING_ALLOWED=NO. Local hardware QA may
# select a personal development team and override the user-defined bundle/App
# Group settings below; no repository-owned signing identity is committed.
#
# Source layout rule (issue #11 prep): Sources/Shared is platform-agnostic
# (Foundation+Security only — models, clients, formatting, pairing; NO
# UIKit/SwiftUI/ActivityKit imports) so the macOS glance surface can compile
# those files verbatim. Sources/SharedActivity is the iOS-only ActivityKit
# attributes shared between the app and its widget extension.
name: HealthMesCompanion
options:
  bundleIdPrefix: com.healthmes
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    # Override these two user-defined settings for a personal development
    # team before a signed hardware build. Simulator/CI builds keep the
    # stable defaults below.
    HEALTHMES_BUNDLE_ID_PREFIX: com.healthmes
    HEALTHMES_APP_GROUP_ID: group.com.healthmes.companion

targets:
  # ---------------------------------------------------------------- iOS app
  # Full companion app (issue #10): briefing home, weekly report, capture
  # shortcuts, real proposal actions, native notifications (BGAppRefreshTask
  # + UNUserNotificationCenter), focus-block Live Activity, in-app decision
  # viewer. Local-first: the paired base URL is the only network destination.
  HealthMesCompanion:
    type: application
    platform: iOS
    sources:
      - Sources/Shared
      - Sources/SharedActivity
      - Sources/App
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: HealthMesWidgets
      - target: HealthMesNotificationContent
      - target: HealthMesWatchApp
      - sdk: HealthKit.framework
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(HEALTHMES_BUNDLE_ID_PREFIX).companion
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Support/HealthMesCompanion-Info.plist
      properties:
        CFBundleDisplayName: HealthMes
        HealthMesAppGroupIdentifier: $(HEALTHMES_APP_GROUP_ID)
        HealthMesKeychainAccessGroup: $(AppIdentifierPrefix)$(HEALTHMES_APP_GROUP_ID)
        HealthMesBackgroundRefreshIdentifier: $(HEALTHMES_BUNDLE_ID_PREFIX).companion.refresh
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations: [en, ko]
        # Deep links from widgets / Live Activity / notification routing:
        # healthmes://decision?url=…, healthmes://proposal?id=…,
        # healthmes://capture, healthmes://report (AppRouter validates the
        # decision host against the pairing).
        CFBundleURLTypes:
          - CFBundleURLName: com.healthmes.companion
            CFBundleURLSchemes: [healthmes]
        # Native alert loop: BGAppRefreshTask polls /v1/alerts (OS-throttled;
        # README documents the honesty story — Telegram stays guaranteed).
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - $(HEALTHMES_BUNDLE_ID_PREFIX).companion.refresh
        # Capture shortcuts (photos re-encoded to JPEG, voice memos to m4a;
        # bytes go only to the paired instance's POST /v1/media).
        NSCameraUsageDescription: >-
          Photos of meals or medication are uploaded only to your own
          HealthMes instance.
        NSMicrophoneUsageDescription: >-
          Voice memos are uploaded only to your own HealthMes instance.
        NSSpeechRecognitionUsageDescription: >-
          HealthMes turns your spoken goal or task into a Plan item without
          offering a text-command composer.
        NSFaceIDUsageDescription: >-
          HealthMes verifies that it is you before applying a calendar
          decision from the lock screen.
        NSCalendarsFullAccessUsageDescription: >-
          HealthMes checks calendars already configured on this iPhone so
          device permission and server synchronization can be shown separately.
        NSHealthShareUsageDescription: >-
          HealthMes reads health and activity data from Apple Health to make
          wellness-aware schedule suggestions on your own paired server.
        # Focus-block Live Activity (polling-updated; no push channel).
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        # Keep ATS scoped for loopback development. Pairing validation permits
        # HTTP only for localhost/127.0.0.0/8/::1 and requires HTTPS for every
        # remote host, including private-LAN addresses.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Support/HealthMesCompanion.entitlements
      properties:
        com.apple.security.application-groups:
          - $(HEALTHMES_APP_GROUP_ID)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HEALTHMES_APP_GROUP_ID)
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true

  # ------------------------------------------- iOS home + lock-screen widgets
  # Also hosts the focus-block Live Activity UI (ActivityKit renders live
  # activities from the widget extension).
  HealthMesWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Shared
      - Sources/SharedActivity
      - Sources/SharedWidget
      - Sources/Widgets
    resources:
      - Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEALTHMES_BUNDLE_ID_PREFIX).companion.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
    info:
      path: Support/HealthMesWidgets-Info.plist
      properties:
        CFBundleDisplayName: HealthMes Glance
        HealthMesAppGroupIdentifier: $(HEALTHMES_APP_GROUP_ID)
        HealthMesKeychainAccessGroup: $(AppIdentifierPrefix)$(HEALTHMES_APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
        # Scoped like the app target for loopback development only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Support/HealthMesWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(HEALTHMES_APP_GROUP_ID)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HEALTHMES_APP_GROUP_ID)

  # --------------------------------------- expanded actionable notification UI
  HealthMesNotificationContent:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Shared/Pairing.swift
      - Sources/NotificationContentExtension
    resources:
      - Resources/Localizable.xcstrings
    dependencies:
      - sdk: LocalAuthentication.framework
      - sdk: UserNotifications.framework
      - sdk: UserNotificationsUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEALTHMES_BUNDLE_ID_PREFIX).companion.notification-content
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
    info:
      path: Support/HealthMesNotificationContent-Info.plist
      properties:
        CFBundleDisplayName: HealthMes Decision
        HealthMesAppGroupIdentifier: $(HEALTHMES_APP_GROUP_ID)
        HealthMesKeychainAccessGroup: $(AppIdentifierPrefix)$(HEALTHMES_APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: HEALTHMES_ALERT_ACTIONABLE
            UNNotificationExtensionDefaultContentHidden: true
            UNNotificationExtensionInitialContentSizeRatio: 0.58
            UNNotificationExtensionUserInteractionEnabled: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Support/HealthMesNotificationContent.entitlements
      properties:
        com.apple.security.application-groups:
          - $(HEALTHMES_APP_GROUP_ID)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HEALTHMES_APP_GROUP_ID)

  # ------------------------------------------------------------- watchOS app
  # Modern single-target watch app. It is embedded in the iOS companion so
  # paired simulator and signed-device installs preserve the counterpart
  # relationship required by WatchConnectivity. It can also fetch
  # independently after receiving the pairing from the phone.
  HealthMesWatchApp:
    type: application
    platform: watchOS
    sources:
      - Sources/Shared
      - Sources/WatchApp
    resources:
      - Resources/Localizable.xcstrings
    dependencies:
      - target: HealthMesWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEALTHMES_BUNDLE_ID_PREFIX).companion.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: Support/HealthMesWatchApp-Info.plist
      properties:
        CFBundleDisplayName: HealthMes
        WKApplication: true
        HealthMesAppGroupIdentifier: $(HEALTHMES_APP_GROUP_ID)
        WKCompanionAppBundleIdentifier: $(HEALTHMES_BUNDLE_ID_PREFIX).companion
        WKRunsIndependentlyOfCompanionApp: true
        # Scoped like the app target: LAN/.local HTTP only, no global ATS off.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Support/HealthMesWatchApp.entitlements
      properties:
        com.apple.security.application-groups:
          - $(HEALTHMES_APP_GROUP_ID)

  # -------------------------------------------------- watchOS complications
  HealthMesWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - Sources/Shared
      - Sources/SharedWidget
      - Sources/WatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEALTHMES_BUNDLE_ID_PREFIX).companion.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: true
    info:
      path: Support/HealthMesWatchWidgets-Info.plist
      properties:
        CFBundleDisplayName: HealthMes Energy
        HealthMesAppGroupIdentifier: $(HEALTHMES_APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Scoped like the app target: LAN/.local HTTP only, no global ATS off.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Support/HealthMesWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(HEALTHMES_APP_GROUP_ID)

  # ------------------------------------------------------------------ tests
  # Host-less unit-test bundle: compiles Sources/Shared directly, so the
  # contract/request-builder/grammar tests run without launching any app.
  HealthMesCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Sources/Shared
      - Sources/App/DeviceCalendarPermission.swift
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEALTHMES_BUNDLE_ID_PREFIX).companion.tests
    info:
      path: Support/HealthMesCompanionTests-Info.plist
      properties: {}

  # End-to-end UI tests (daily-loop acceptance): launch the app, tab through
  # briefing/report/capture, apply a proposal against the REAL endpoints.
  # They XCTSkip themselves when no paired live instance answers, so plain
  # CI runs stay green without a server (see README "Live smoke test").
  HealthMesCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: HealthMesCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEALTHMES_BUNDLE_ID_PREFIX).companion.uitests
        TEST_TARGET_NAME: HealthMesCompanion
    info:
      path: Support/HealthMesCompanionUITests-Info.plist
      properties: {}

schemes:
  HealthMesCompanion:
    build:
      targets:
        HealthMesCompanion: all
    test:
      targets:
        - HealthMesCompanionTests
        - HealthMesCompanionUITests
  HealthMesWatchApp:
    build:
      targets:
        HealthMesWatchApp: all
